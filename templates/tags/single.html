{% extends "base.html" %}

{% block content %}
<header class="page-head">
  <p class="eyebrow">Tagged</p>
  <h1>{{ term.name }}</h1>
</header>

<ul class="post-list">
  {%- for post in term.pages %}
  <li class="post-item">
    <a href="{{ post.permalink | safe }}">{{ post.title }}</a>
    <time datetime="{{ post.date }}">{{ post.date | date(format="%b %d, %Y") }}</time>
    {%- if post.description %}
    <p>{{ post.description }}</p>
    {%- endif %}
  </li>
  {%- endfor %}
</ul>

<p class="back"><a href="{{ get_url(path="tags") | safe }}"><span aria-hidden="true">←</span> All tags</a></p>
{% endblock content %}
