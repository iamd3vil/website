{% extends "base.html" %}

{% block content %}
<header class="page-head">
  <h1>Tags</h1>
</header>

<ul class="tag-cloud">
  {%- for term in terms %}
  <li><a href="{{ term.permalink | safe }}">{{ term.name }} <span class="count">{{ term.pages | length }}</span></a></li>
  {%- endfor %}
</ul>
{% endblock content %}
